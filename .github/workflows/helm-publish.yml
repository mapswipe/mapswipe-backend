name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - project/*
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  _:
    uses: toggle-corp/banjo-action/.github/workflows/pipeline.yml@v0.4.0
    permissions:
      contents: write
      packages: write
      pull-requests: read
    with:
      # -- Same as CI (./ci.yml)
      # Job: Pre-commit
      pre_commit__apt_packages: "gdal-bin libgdal-dev"
      # Job: Docker
      docker__wait_cmd: "./manage.py wait_for_resources --db --cache --celery-broker"
      docker__migration_dummy_test: "main.tests.fake_test"
      docker__run_graphql_check: true
      docker__run_openapi_check: false
      docker__compose_file: "docker-compose.yaml:.github/gh-docker-compose.yaml"
      docker__compose_service_name: "test"
      docker__compose_test_cmd: "/code/misc/run_tests.sh"
      docker__codecov_upload: true
      # Job: Helm
      helm__chart_directory: "./helm"
      helm__version: "v4.2.2"
      # -- Publish
      docker__push: true
      helm__push: true
      # Create a GitHub release (git-cliff changelog + helm/docker provenance) on tag pushes.
      github_release__create: ${{ github.ref_type == 'tag' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
