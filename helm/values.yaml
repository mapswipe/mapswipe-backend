app:
  environment: PROD
  # settings.py reads APP_TYPE (also the Sentry app_type tag). Let banjo-helm set it
  # per workload (web / worker / beat / hook) instead of hardcoding a role in shared env.
  appTypeEnvName: APP_TYPE
  # Global image
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  api:
    enabled: true
    containerPort: 80
    command: ["/code/misc/prod/run_web.sh"]
    probes:
      enabled: true    # chart defaults: liveness /healthz/live/, readiness+startup /healthz/ready/
    ingress:
      enabled: true
      # NOTE: className left blank on purpose; body-size + ingress class are set in
      # values/traefik.yaml. Set `host` per environment in the env overlay.
      className:
      host:
    resources:
      requests:
        cpu: "0.2"
        memory: 0.5Gi
      limits:
        cpu: "2"
        memory: 1Gi

  worker:
    enabled: true
    queueDefaults:
      commandPrefix:
        - "celery"
        - "-A"
        - "main"
        - "worker"
        - "-l"
        - "INFO"
      # banjo-celery-probe heartbeat wiring (writer via setup_worker_heartbeat,
      # reader via banjo-celery-probe) on a RAM emptyDir.
      extraEnv:
        BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/worker_heartbeat
      volumes:
        celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
      volumeMounts:
        celery-heartbeat: {mountPath: /var/run/celery}
      probes:
        enabled: true
        liveness:
          exec: {command: [banjo-celery-probe]}
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        startup:
          exec: {command: [banjo-celery-probe]}
          periodSeconds: 5
          failureThreshold: 30
      resources:
        requests:
          cpu: "0.1"
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 2Gi
    queues:
      # NOTE: Make sure keys are lowercase
      default:
        enabled: true
        celeryArgs:
          - "-Q"
          - "default"
          - "--concurrency"
          - "4"
          - "--max-tasks-per-child"
          - "10"
    addons:
      beat:
        enabled: true
        strategy: {type: Recreate}
        # settings.py sets CELERY_BEAT_SCHEDULER = django_celery_beat DatabaseScheduler,
        # so use HeartbeatDatabaseScheduler (DB-sourced schedules) and touch the beat
        # heartbeat file each tick for banjo-celery-probe liveness.
        command:
          - "celery"
          - "-A"
          - "main"
          - "beat"
          - "-l"
          - "INFO"
          - "--scheduler=banjo_utils.celery_health.database.HeartbeatDatabaseScheduler"
        extraEnv:
          BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/beat_heartbeat
        volumes:
          celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        volumeMounts:
          celery-heartbeat: {mountPath: /var/run/celery}
        probes:
          enabled: true
          liveness:
            # DatabaseScheduler polls every ~5s, so a tighter --max-age is fine
            exec: {command: [banjo-celery-probe, --max-age, "60"]}
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
        resources:
          requests:
            cpu: "0.1"
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
      flower:
        enabled: false

  hooks:
    enabled: true
    jobs:
      # NOTE: Make sure keys are lowercase.
      # db-migrate and collect-static inherit the chart defaults (manage.py migrate /
      # collectstatic --noinput). wait-for-resources (Sync hook, early wave) gates the
      # app on DB + cache + broker + S3 connectivity (first *_S3_ENDPOINT_URL).
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db", "--cache", "--celery-broker", "--minio"]

  # NOTE: Check main/settings.py for all available options. Per-environment values
  # (domains, S3 endpoint, and all secrets) are supplied by the env overlays + CICD.
  env:
    APP_RELEASE: "{{ $.Values.image.tag }}"
    APP_ENVIRONMENT: "{{ $.Values.environment }}"
    TIME_ZONE: "UTC"
    DEBUG: "false"
    # Storage (see main/storage_config.py). The filesystem backend uses the ephemeral
    # pod filesystem, so use object storage (s3 or gcs). Bucket names, endpoints and
    # credentials (<PREFIX>_S3_* / <PREFIX>_GCS_*) are supplied per-environment.
    MEDIA_STORAGE_BACKEND: "s3"
    # MEDIA_STORAGE_S3_BUCKET_NAME: "<media-bucket>"
    STATIC_STORAGE_BACKEND: "s3"
    # STATIC_STORAGE_S3_BUCKET_NAME: "<static-bucket>"
    # Short-term storage for exports of active projects. Must not resolve to the media
    # bucket + location. Set SHORT_TERM_STORAGE_ENABLED to "false" to write exports to media;
    # keep the backend config while short-term files exist, so they still resolve.
    SHORT_TERM_STORAGE_ENABLED: "true"
    SHORT_TERM_STORAGE_BACKEND: "s3"
    # SHORT_TERM_STORAGE_S3_BUCKET_NAME: "<short-term-bucket>"
    # Sentry
    SENTRY_ENABLED: "false"
    SENTRY_TRACES_SAMPLE_RATE: "0.2"
    SENTRY_PROFILE_SAMPLE_RATE: "0.2"

  # Redis (Dragonfly) broker + cache and the Dragonfly CR live in values/operators.yaml.
